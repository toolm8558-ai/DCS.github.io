services:
  - type: web
    name: dcs-trendweb
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_URI
        sync: false
      - key: ACCESS_KEY
        generateValue: true
      - key: DB_NAME
        value: plant_trend
      - key: ALLOWED_ORIGIN
        value: https://toolm8558-ai.github.io
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY_FALLBACK
        sync: false
      - key: OPENROUTER_MODEL
        value: openrouter/auto
